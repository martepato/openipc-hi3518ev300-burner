[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hisiburn"
version = "0.1.0"
description = "Open-source USB flasher for HiSilicon Hi3518EV300 cameras — a macOS-native replacement for HiTool/HiBurn"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["hisilicon", "hi3518ev300", "openipc", "usb", "flashing", "hiburn", "hitool"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]
dependencies = ["pyusb>=1.2.1"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
hisiburn = "hisiburn.cli:main"

[project.urls]
Homepage = "https://github.com/martepato/openipc-hi3518ev300-burner"
Issues = "https://github.com/martepato/openipc-hi3518ev300-burner/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hisiburn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
